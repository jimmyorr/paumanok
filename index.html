    <style>
      body {
        /* Background gradient. */
        background: linear-gradient(to bottom, lightblue, aliceblue);
        /* Set the body to always cover the full viewport height (100vh),
               so the background fills the screen even if the content is shorter. */
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      h1 {
        font-family: "Lobster", cursive;
        font-size: 4rem;
        text-align: center;
        color: #333;
        margin-bottom: 40px;
      }

      .gallery {
        /* Flexible layout. */
        display: flex;
        /* Wrap if necessary. */
        flex-wrap: wrap;
        /* Gap between items. */
        gap: 15px;
        /* Center horizontally within the container. */
        justify-content: center;
        max-width: 1200px;
        margin: 0 auto;
      }

      .gallery img {
        /* 20% of the full image size. */
        width: 165px;
        height: 225px;
        cursor: pointer;
        /* Rounded corners. */
        border-radius: 10px;
        /* Subtle shadow effect. */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease-in-out;
        display: block;
      }

      .gallery img:hover {
        transform: scale(1.05);
      }

      .pswp__img {
        /* Same rounded corners as the gallery view. */
        border-radius: 10px;
      }
