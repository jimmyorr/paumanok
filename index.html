    <style>
      body {
        /* Background gradient. */
        background: linear-gradient(to bottom, lightblue, aliceblue);
        /* Set the body to always cover the full viewport height (100vh),
               so the background fills the screen even if the content is shorter. */
        min-height: 100vh;
      }

      h1 {
        font-family: "Lobster", cursive;
        font-size: 4rem;
        text-align: center;
      }

      .gallery {
        /* Flexible layout. */
        display: flex;
        /* Wrap if necessary. */
        flex-wrap: wrap;
        /* Gap between items. */
        gap: 10px;
        /* Center horizontally within the container. */
        justify-content: center;
      }

      .gallery img {
        /* 20% of the full image size. */
        width: 165px;
        height: 225px;
        cursor: pointer;
        /* Rounded corners. */
        border-radius: 10px;
        /* Subtle shadow effect. */
        box-shadow: 0 2px 5px darkgray;
      }

      .pswp__img {
        /* Same rounded corners as the gallery view. */
        border-radius: 10px;
      }
    </style>

  <body>
    <h1>Paumanok</h1>
    <main>
      <div class="gallery" id="gallery" aria-live="polite"></div>
      <noscript>
        <p style="text-align: center">
          This gallery requires JavaScript. Open the <code>cards/</code> folder
          to view images if JavaScript is disabled.
        </p>
      </noscript>
    </main>

    <!-- PhotoSwipe Core Structure -->
    <div class="pswp" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="pswp__bg"></div>
      <div class="pswp__scroll-wrap">
        <div class="pswp__container">
          <div class="pswp__item"></div>
          <div class="pswp__item"></div>
          <div class="pswp__item"></div>
        </div>
        <div class="pswp__ui pswp__ui--hidden">
          <div class="pswp__top-bar">
            <div class="pswp__counter"></div>
            <button
              class="pswp__button pswp__button--close"
              title="Close (Esc)"
            ></button>
            <button
              class="pswp__button pswp__button--fs"
              title="Toggle fullscreen"
            ></button>
            <button
              class="pswp__button pswp__button--zoom"
              title="Zoom in/out"
            ></button>
            <div class="pswp__preloader">
              <div class="pswp__preloader__icn">
                <div class="pswp__preloader__cut">
                  <div class="pswp__preloader__donut"></div>
                </div>
              </div>
            </div>
          </div>
          <button
            class="pswp__button pswp__button--arrow--left"
            title="Previous (arrow left)"
          ></button>
          <button
            class="pswp__button pswp__button--arrow--right"
            title="Next (arrow right)"
          ></button>
          <div class="pswp__caption">
            <div class="pswp__caption__center"></div>
          </div>
        </div>
      </div>
    </div>
